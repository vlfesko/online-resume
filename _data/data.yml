profile:
  show: true
  order: 1
  title: Profile
  description: |
    I'm an engineer who loves both building software and running the infrastructure behind it.

    I started as an IT technician, looking after Windows and Unix machines and writing small tools and scripts to make everyday work easier for people.
    Later I spent several years teaching software development and IT infrastructure. I really enjoyed it, and hundreds of my students went on to build careers in tech.
    That's when I understood what drives me most: going deep into how technology really works and building software on top of it.

experience:
  show: true
  order: 2
  title: Experiences
  description: |
    For many years I work with dev teams to make as good software as possible, leveraging modern tools and technologies.

  items:
    - company: Own product development
      tags: Product
      date: 2026 - present
      role: Tech Lead / Developer / DevOps
      location: Kyiv, Ukraine
      description: |
        Family of cross-platform desktop applications with cloud backends, built end to end: architecture, code, release pipeline, hosting.
        + Desktop apps in Rust (egui) for macOS and Windows: universal builds (Apple Silicon + Intel, macOS 12+), code signing and notarization, installers, auto-update
        + Shared component libraries reused across apps (Rust) and sites (JavaScript), vendored with a version lock
        + Speech recognition (Whisper), ONNX models, screen and camera recording (FFmpeg), AI text tools via LLM provider APIs
        + Video surveillance integration on Windows: camera relays, Qt + GStreamer client, vendor SDK bridged to HTTP/JSON, licence plate recognition
        + Cloud backends in Node.js (Fastify) + PostgreSQL: accounts, sign-in, licensing and payments, release channels, update manifests
        + Hosting on a self-built k3s cluster at Hetzner: Traefik + Let's Encrypt, Longhorn, CloudNativePG, CrowdSec, network policies, one-command deploys
        + Self-hosted services: Umami analytics, n8n automation, Plane project tracking; Cloudflare DNS/CDN
        + AI-assisted engineering workflow with agentic coding tools: parallel work in branches/worktrees, design-to-code pixel checks, tiered tests

    - company: Sovereign digital workplace platform
      tags: Smile
      date: 2026
      role: Tech Lead / DevOps
      location: Kyiv, Ukraine
      description: |
        Collaboration suite on private Kubernetes, preproduction and production clusters, built from idempotent provisioning scripts.
        + k3s clusters (multi-node), Traefik, cert-manager, load balancer and edge front-end on OVH, Pod Security, NetworkPolicies
        + Storage and data: Longhorn, Garage (S3), CloudNativePG with backups and restore tests, Redis Sentinel, Percona MongoDB operator, Elasticsearch (ECK), off-site backups
        + Applications: Nextcloud (Talk with TURN/recording, Collabora / Euro-Office, Whiteboard, full-text search), Matrix (Synapse), XWiki, OpenProject, Penpot, Budibase, Snipe-IT
        + Identity and mail: SSO with Keycloak (OIDC), BlueMind integration, IMAP autoconfig
        + On-premise AI: models on an NVIDIA DGX host behind an LLM gateway, LibreChat, Nextcloud Assistant and context agent, Arize Phoenix tracing
        + Operations: Prometheus / Grafana monitoring, centralised logging, CrowdSec, Headlamp, Dozzle, private image registry; zero-downtime upgrades of apps and nodes

    - company: Identity and access management platform
      tags: Smile
      date: 2026
      role: Tech Lead / DevOps
      location: Kyiv, Ukraine
      description: |
        Identity and access management platform (Univention Nubus, Keycloak) on Kubernetes, with a production-shaped local environment.
        + GitOps: Argo CD with a Helm render plugin, Forgejo + Actions runners, External Secrets with OpenBao (Vault API)
        + Infrastructure as code with OpenTofu: databases and roles, S3 buckets, secrets layout, DNS zones (PowerDNS), operator IdP
        + Edge security: ALB with Caddy + Coraza WAF (OWASP CRS), TLS bridging, HAProxy Ingress, cert-manager, admission policy for allowed registries
        + Supply chain: Harbor registry with Trivy scanning, image mirroring by digest with signatures
        + Data protection: PostgreSQL with pgBackRest (WAL archive, point-in-time clone), Velero backups, SeaweedFS object storage
        + Observability and audit: OpenTelemetry Collector, Prometheus, Loki, Grafana, Alertmanager with unit-tested rules, SIEM feed
        + Smoke tests across the whole request path, NetworkPolicy checks, documentation verified against the running environment

    - company: Latest projects
      date: past years
      role: Developer / DevOps / TeamLead
      location: WorldWide
      description: |
        + Laravel applications developed from scratch: Financial, SEO, Crypto, News, Sports domains
        + Magento 2 applications hosted and maintained
        + Built AWS solutions for web applications
        + Server infrastructure optimization performed, migrated web apps to new hosting
        + Automated AI workflows with n8n
        + Conducted OWASP Top 10:2025 training
        + many more...

    - company: Smile Ukraine - Open Source Solutions in Ukraine
      link: "https://smile-ukraine.com/"
      tags: Full-time
      date: 2013.05 - present
      role: DevOps Team Lead / CTO
      location: Kyiv, Ukraine
      description: |
        In past 10 years as a DevOps Team Lead / CTO:
        + Significantly improved company infrastructure, maintained its important services (securely connected offices across several countries, ISP failover, DNS etc) 
        + Established internal IT team of 10+ members providing DevOps Services, supervising and coordinating, recruiting and adapting new people
        + Established and oversaw development standards (web applications, CI/CD, infrastructure) 
        + Built technical solution concepts, PoCs
        + Built internal DC based on Open Nebula
        + Steered technology communities
        + Dealt with legacy systems, migrating to modern technologies
        + Helped pre-sales team to prepare valuable offers
        + Performed technical, performance and security audits 
        + Mastered extreme troubleshooting skills over years
        + Went from SVN to GitLab, from Fabric to modern CI/CD, from pfSense to RouterOS and from Windows to Mac
        
        Conducted trainings:
        + Magento 2 technology stack and Certification
        + DevOps technology stack
        + Web/HTTP FastTrack
        + OWASP Top 10 vulnerabilities

        Active developer / DevOps:
        + Wrote apps in Laravel, Slim and other handy frameworks
        + Maintained infrastructure (configuration management, monitoring...)
        + Supported project teams (problem solving, architecture, performance)

    - company: Smile Ukraine - Open Source Solutions in Ukraine
      link: "https://smile-ukraine.com/"
      tags: Full-time
      date: 2012.04 - 2013.05
      role: PHP/Magento Developer
      location: Kyiv, Ukraine
      description: |
        Mastered Magento 1 Enterprise Edition from scratch and certified as Developer PLUS and Zend PHP Engineer.
        + Magento 1 eCommerce solutions development and delivery
        + Data import/export and optimization
        + Service integrations
        + Direct communications with business
        + Maintained other PHP technologies: Drupal, WordPress, Joomla

    - company: Knauf Gips Donbass
      link: "https://www.knauf.ua/"
      tags: Full-time
      date: 2010.05 - 2012.04
      role: System Administrator
      location: Soledar, Ukraine
      description: |
        As a Systems Administrator I had a wide-ranging duties including installing,
        supporting and maintaining servers and other computer systems, developing and deploying intranet software,
        maintaining and improving websites in PHP, planning for and responding to service outages,
        data processing automation with tools developed in program language which is appropriate to situation.
        + Maintained and improved existing IT infrastructure
        + Automated data processing with developed tools in C#, Delphi
        + Wrote technical documentation
        + Designed and implemented automated data backup systems
        + Developed user's help desk system in PHP (LAMP)

    - company: Bakhmut Transport Infrastructure College
      link: "https://acti.dn.ua/"
      tags: Full-time
      date: 2009.09 - 2010.04
      role: IT Engineer
      location: Bakhmut, Ukraine
      description: |
        Maintaining and improving IT infrastructure, optimizing business processes and IT goals, lecturing.
        + Restructurized IT infrastructure
        + Developed intranet software in Delphi
        + Designed and implemented microcontroller driven systems
        + Maintained websites in PHP
        + Managed work of system administrators
        + Lectured in Computer Sciences and Fundamentals of Electrical Engineering

    - company: Bakhmut Transport Infrastructure College
      link: "https://acti.dn.ua/"
      tags: Full-time
      date: 2005.08 - 2009.09
      role: IT Techinical / System Administrator
      location: Bakhmut, Ukraine
      description: |
        Maintaining Windows/Unix systems, lecturing.
        + Developed schedule construction tool in Delphi, electronic books shell and other internal tools
        + Maintained websites in PHP
        + Configured and maintained Unix-based proxy, Internet and e-mail server
        + Lectured in Computer Sciences and Fundamentals of Electrical Engineering

